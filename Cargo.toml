[package]
name = "avocado-conn"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "avocado-conn"
path = "src/main.rs"

[features]
default = ["id-dmi", "id-devicetree", "id-rpi", "id-imx", "id-nic-mac"]
id-dmi = []
id-devicetree = []
id-rpi = []
id-imx = []
id-nic-mac = []

[dependencies]
tokio = { version = "1", features = ["full"] }
# Use rumqttc's `use-rustls-no-provider` feature instead of `use-rustls`.
# `use-rustls` activates `tokio-rustls/default`, which transitively pulls
# `aws-lc-rs` onto the same rustls 0.23 crate that reqwest uses with
# `ring` — and rustls 0.23 refuses to auto-pick when more than one
# crypto provider is registered. By using the no-provider feature we let
# reqwest's rustls-tls (which activates tokio-rustls/ring) be the sole
# provider source, keeping `ring` as the only provider in the tree.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
webpki-roots = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Direct rustls dep so main.rs can call `rustls::crypto::ring::default_provider()`
# as defense-in-depth init. The provider feature is also activated transitively
# via reqwest → tokio-rustls/ring → rustls/ring; pinning here makes the path
# explicit at our crate's vertex of the dep graph.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
base64 = "0.22"

[profile.release]
strip = true
lto = true
