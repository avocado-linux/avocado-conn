supported_targets: '*'

extensions:
  avocado-ext-connect:
    # The extension version tracks the packaged program: CI reads it from Cargo.toml
    # ([package] version) and exports AVOCADO_EXT_VERSION (.github/workflows/release.yml).
    # Locally: `AVOCADO_EXT_VERSION=<x> avocado ext package …` (unset => empty + a warning).
    version: '{{ env.AVOCADO_EXT_VERSION }}'
    release: r1
    summary: Avocado Connect daemon
    description: Avocado Connect daemon
    license: Apache-2.0
    url: https://github.com/avocado-linux/avocado-conn
    vendor: Avocado Linux <info@avocadolinux.org>
    # Stage the Rust source (the repo root IS the project) plus the packaging
    # artifacts, so `ext package` can compile it.
    package_files:
      - overlay
      - avocado.yaml
      - con-*.sh
      - Cargo.toml
      - Cargo.lock
      - src

    overlay: overlay

    enable_services:
      - avocado-conn.service

    on_merge:
      - systemctl start --no-block avocado-conn.service

    on_unmerge:
      - systemctl stop avocado-conn.service

    packages:
      avocado-conn:
        compile: avocado-conn
        install: con-install.sh

    sdk:
      packages:
        nativesdk-binutils: '*'
        nativesdk-cargo: '*'
        nativesdk-gcc: '*'
        nativesdk-glibc-dev: '*'
        nativesdk-libgcc-dev: '*'
        nativesdk-rust: '*'
        packagegroup-rust-cross-canadian-avocado-{{ avocado.target }}: '*'

sdk:
  image: docker.io/avocadolinux/sdk:{{ env.AVOCADO_DISTRO_RELEASE }}

  compile:
    avocado-conn:
      compile: con-compile.sh
      clean: con-clean.sh
      packages:
        libstd-rs: '*'
        libstd-rs-dev: '*'
  packages:
    avocado-sdk-toolchain: '*'
